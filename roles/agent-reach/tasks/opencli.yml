---
# OpenCLI (@jackwener/opencli) is agent-reach's X fallback: `opencli twitter search`
# reads through the logged-in Chrome, while twitter-cli 0.8.5's search returns HTTP 404
# (2026-10-09). agent-reach's install doc adds it only on a fresh install, so it lives here
# as a mise npm tool: `mise up` keeps it current and a Node upgrade cannot drop it
# (grilling Q19). Its Chrome extension is a one-time click, not provisioned.
- name: Ensure OpenCLI is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: "npm:@jackwener/opencli"
    mise_cmd: opencli
