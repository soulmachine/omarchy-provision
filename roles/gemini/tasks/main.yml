---
# Gemini CLI is Omarchy's mise tool (npm `@google/gemini-cli`) with its ~/.local/bin/gemini
# stub; the mise role's `mise up` keeps it current. `gemini-gw`, which Omarchy's patched
# launcher starts, and the model settings in ~/.gemini/settings.json come from
# `cliproxy-tier <host>` on mac-mini-m2 (coding-agent Q374).
- name: Ensure Gemini CLI is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: gemini
    mise_cmd: gemini
