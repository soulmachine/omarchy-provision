---
# Gemini CLI is Omarchy's mise tool (npm `@google/gemini-cli`) with its ~/.local/bin/gemini
# stub; the mise role's `mise up` keeps it current. `cliproxy-tier <host>` on mac-mini-m2
# replaces that stub with a gateway shim, and writes `gemini-origin` and its Google-login home
# ~/.gemini-origin (~/coding-agent/devops/cliproxyapi/gateway-policy.md).
- name: Ensure Gemini CLI is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: gemini
    mise_cmd: gemini
