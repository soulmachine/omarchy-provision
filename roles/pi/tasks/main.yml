---
# pi is Omarchy's mise tool with its ~/.local/bin/pi stub; the mise role's `mise up` keeps it
# current, so the Mac role's bun install and `pi update` steps are gone.
- name: Ensure pi is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: pi
    mise_cmd: pi

# Mirrors https://github.com/kunchenguid/dotfiles/tree/main/home/.pi/agent,
# minus the `calm` extension. The author's rationale for each setting is at
# https://blog.kunchenguid.com/p/kuns-pi-agent-config.
# Extensions are auto-discovered from every *.js /
# *.ts file and */index.{js,ts} under ~/.pi/agent/extensions, so leaving the
# `calm/` directory out of files/ is the whole of "without calm": no
# settings.json entry references it.
#
# This is a merge, not a sync: `copy` only writes the files shipped here, so
# the sibling ~/.pi/agent/skills tree (populated by the `skills` role) and
# pi's own runtime state are left alone. settings.json lives outside agent/ and
# is written by the next two tasks: files/settings.json wins, except that a
# cliproxy model picked in pi stays (~/coding-agent/devops/cliproxyapi/gateway-policy.md). Other tweaks made
# in-app via `/settings` belong in files/settings.json to survive.
#
# That overwrite is also why settings.json's `packages` list carries the
# `git:github.com/DietrichGebert/ponytail` entry: the `ponytail` role installs
# that package with `pi install`, which appends exactly this string, and
# without it here every run of this copy would strip the entry again and pi
# would stop loading a checkout still on disk (roles/ponytail/tasks/pi.yml).
# models.json lives outside agent/ too: cliproxy-tier writes its cliproxy provider
# from GW_MODELS, and the next tasks keep it (macbook-provision Q273). Before Q77 this copy
# dropped the gateway config every night. pi is gateway-only by policy; see macbook-provision Q81.
- name: Install pi agent configuration
  ansible.builtin.copy:
    src: agent/
    dest: "{{ lookup('env', 'HOME') }}/.pi/agent/"
    mode: "0644"
    directory_mode: "0755"

- name: Read pi's current models
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.pi/agent/models.json"
  register: pi_models_raw
  failed_when: false
  check_mode: false

# files/models.json wins, except the cliproxy provider. A new host has none until
# its first `cliproxy-tier` run, which it needs for the gateway key anyway.
- name: Install pi models, keeping the cliproxy provider cliproxy-tier wrote
  ansible.builtin.copy:
    content: "{{ lookup('file', 'models.json') | from_json | combine(pi_gw, recursive=True) | to_nice_json(indent=2, sort_keys=false) }}\n"
    dest: "{{ lookup('env', 'HOME') }}/.pi/agent/models.json"
    mode: "0644"
  vars:
    pi_cur: "{{ (pi_models_raw.content | b64decode | from_json) if pi_models_raw.content is defined else {} }}"
    pi_gw: >-
      {{ {'providers': {'cliproxy': pi_cur.providers.cliproxy}}
         if 'cliproxy' in pi_cur.get('providers', {}) else {} }}

- name: Read pi's current settings
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.pi/agent/settings.json"
  register: pi_settings_raw
  failed_when: false
  check_mode: false

# Only the old defaults are replaced: a model named without a provider prefix
# on the cliproxy provider, other than claude-opus-5-5, is the user's pick.
# The Hindsight extension (roles/hindsight's installer adds it) is kept, or the
# hindsight role would re-run its installer on every play.
- name: Install pi settings, keeping a gateway model picked in pi
  ansible.builtin.copy:
    content: "{{ lookup('file', 'settings.json') | from_json | combine(pi_keep, pi_hindsight) | to_nice_json(indent=2, sort_keys=false) }}\n"
    dest: "{{ lookup('env', 'HOME') }}/.pi/agent/settings.json"
    mode: "0644"
  vars:
    pi_old: "{{ (pi_settings_raw.content | b64decode | from_json) if pi_settings_raw.content is defined else {} }}"
    pi_keep: >-
      {{ {'defaultModel': pi_old.defaultModel}
         if (pi_old.defaultProvider | default('') == 'cliproxy'
             and pi_old.defaultModel | default('') | length > 0
             and '/' not in pi_old.defaultModel
             and pi_old.defaultModel != 'claude-opus-5-5')
         else {} }}
    pi_hindsight_ext: "{{ pi_old.extensions | default([]) | select('search', '/\\.hindsight/coding-agents/') | list }}"
    pi_hindsight: "{{ {'extensions': pi_hindsight_ext} if pi_hindsight_ext else {} }}"

- name: Add pi-yolo alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias pi-yolo="pi --thinking max --approve"'
    regexp: '^alias pi-yolo='
    state: present

- name: Add pi-yolo-kimi alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias pi-yolo-kimi="pi --thinking max --approve --model k3"'
    regexp: '^alias pi-yolo-kimi='
    state: present
