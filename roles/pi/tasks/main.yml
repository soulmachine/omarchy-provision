---
# pi is Omarchy's mise tool with its ~/.local/bin/pi stub; the mise role's `mise up` keeps it
# current, so the Mac role's bun install and `pi update` steps are gone.
- name: Ensure pi is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: pi
    mise_cmd: pi

# Mirrors https://github.com/kunchenguid/dotfiles/tree/main/home/.pi/agent,
# minus the `calm` extension. The author's rationale for each setting is at
# https://blog.kunchenguid.com/p/kuns-pi-agent-config.
# Extensions are auto-discovered from every *.js /
# *.ts file and */index.{js,ts} under ~/.pi/agent/extensions, so leaving the
# `calm/` directory out of files/ is the whole of "without calm": no
# settings.json entry references it.
#
# This is a merge, not a sync: `copy` only writes the files shipped here, so
# the sibling ~/.pi/agent/skills tree (populated by the `skills` role) and
# pi's own runtime state are left alone. It does overwrite settings.json on
# every run, so tweaks made in-app via `/settings` belong in files/ to survive.
#
# That overwrite is also why settings.json's `packages` list carries the
# `git:github.com/DietrichGebert/ponytail` entry: the `ponytail` role installs
# that package with `pi install`, which appends exactly this string, and
# without it here every run of this copy would strip the entry again and pi
# would stop loading a checkout still on disk (roles/ponytail/tasks/pi.yml).
# The payload carries the cliproxy provider + defaultModel: this copy used to overwrite
# the hand-installed gateway config every night (the "pi rewrites its config" mystery
# behind cliproxy-assert-pi). pi is gateway-only by policy; see macbook-provision Q81.
- name: Install pi agent configuration
  ansible.builtin.copy:
    src: agent/
    dest: "{{ lookup('env', 'HOME') }}/.pi/agent/"
    mode: "0644"
    directory_mode: "0755"

- name: Add pi-yolo alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias pi-yolo="pi --thinking max --approve"'
    regexp: '^alias pi-yolo='
    state: present

- name: Add pi-yolo-kimi alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias pi-yolo-kimi="pi --thinking max --approve --model k3"'
    regexp: '^alias pi-yolo-kimi='
    state: present
