---
# Grok CLI (xAI) is Omarchy's mise tool `npm:@xai-official/grok` with its ~/.local/bin/grok
# stub; the mise role's `mise up` keeps it current. The npm package is a launcher: the first
# `grok` call downloads the native binary into ~/.grok/bin. Plain `grok` stays native.
# `grok-gw` and its gateway home ~/.grok-gw come from `cliproxy-tier <host>` on mac-mini-m2
# (macbook-provision docs/gateway-policy.md).
- name: Ensure Grok CLI is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: "npm:@xai-official/grok"
    mise_cmd: grok
    mise_bin: grok
