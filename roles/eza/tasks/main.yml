---
# Omarchy's own `ls` and `lt` aliases (/usr/share/omarchy/default/bash/aliases, rewritten by
# omarchy-update) call eza with no path. With no path and a non-tty stdin, eza lists names read
# from stdin, so agents' shells hang or print nothing. This block runs after Omarchy's rc in
# .bashrc and redefines both to pass . when no argument is a path, as macbook-provision and
# ubuntu-provision do in their aliases file. No leading _ on the helper: Claude Code's shell
# snapshot drops _-prefixed functions as completions, which leaves the alias dangling.
- name: Make ls and lt pass a path to eza in .bashrc
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: eza"
    state: present
    block: |
      # shortcut: `--level 2` counts as a path.
      if command -v eza &> /dev/null; then
        eza_ls() { local a; for a in "$@"; do [[ $a == -* ]] || { eza "$@"; return; }; done; eza "$@" .; }
        alias ls='eza_ls -lh --group-directories-first --icons=auto'
        alias lt='eza_ls --tree --level=2 --long --icons --git'
      fi
