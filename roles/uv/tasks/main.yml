---
# uv is Omarchy's mise tool, reached through mise's shims (no ~/.local/bin stub); the mise
# role's `mise up` keeps it current.
- name: Ensure uv is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: uv

- name: Add uv shell completions to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'eval "$(uv generate-shell-completion bash)"'
    regexp: 'uv generate-shell-completion bash'
