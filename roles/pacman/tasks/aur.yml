---
# Install one AUR package with yay. A role includes this with
#
#   - ansible.builtin.include_role:
#       name: pacman
#       tasks_from: aur
#     vars:
#       aur_pkg: kimi-code-bin
#
# community.general.pacman with `executable: yay` cannot do this: it lists the target with
# `--sync --print-format`, which yay answers only for repo packages ("target not found:
# kimi-code-bin", measured 2026-10-11). yay refuses root and calls sudo itself, so no become.
# Upgrades are omarchy-update's `yay -Sua`.
- name: Probe the AUR package {{ aur_pkg }}
  ansible.builtin.command: pacman -Q {{ aur_pkg }}
  register: aur_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the AUR package {{ aur_pkg }}
  ansible.builtin.command: yay -S --needed --noconfirm --removemake --cleanafter {{ aur_pkg }}
  when: aur_installed.rc != 0
  changed_when: true
