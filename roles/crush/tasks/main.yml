---
# Crush (Charm) is Omarchy's mise tool (aqua `charmbracelet/crush`) with its
# ~/.local/bin/crush stub; the mise role's `mise up` keeps it current. Its gateway provider, a
# managed block in ~/.config/crush/crushrc, comes from `cliproxy-tier <host>` on mac-mini-m2
# (coding-agent Q374).
- name: Ensure Crush is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: crush
    mise_cmd: crush
