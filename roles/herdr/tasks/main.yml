---
# herdr is an Omarchy pacman package (omarchy-launch-terminal-herdr and omarchy-refresh-herdr
# depend on it), so omarchy-update keeps it current and the Mac role's install.sh and
# latest.json tasks are not needed. The skill and the title wrapper are the Mac role's.
- name: Install herdr
  become: true
  community.general.pacman:
    name: herdr
    state: present

# Multi-line, so blockinfile rather than the lineinfile used for one-line aliases elsewhere.
# The named marker keeps this block from colliding with any other role's block in .bashrc.
- name: Add the herdr shell wrappers (terminal title, claude-gw resume) to .bashrc
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: herdr"
    state: present
    block: |
      # herdr: title the terminal "herdr <hostname>" instead of just "herdr".
      # The bare "herdr" title comes from the terminal's shell-integration preexec; herdr itself never
      # sets a title, so retitling here after preexec sticks for the whole session.
      herdr() {
        printf '\e]0;herdr %s\a' "${HOSTNAME%%.*}"
        command herdr "$@"
      }
      # herdr restores a claude pane by typing `claude --resume <id>`, which loses claude-gw's gateway
      # and flags. claude-gw marks its sessions in ~/.local/state/claude-gw; resume those through it.
      claude() {
        if [[ -n ${HERDR_ENV:-} && $# -eq 2 && $1 == --resume && -f $HOME/.local/state/claude-gw/$2 ]]; then
          claude-gw "$@"
        else
          command claude "$@"
        fi
      }

# Two tasks keep this both idempotent and fresh: `add` installs once (guarded by
# `creates`, so it no-ops once the skill exists), and `update` re-checks upstream
# every run, reporting `changed` only when the SKILL.md actually moves.
- name: Install the herdr skill (teaches the agent to control Herdr from inside a Herdr pane)
  ansible.builtin.command:
    cmd: npx skills add herdrdev/herdr --skill herdr -g -y
    creates: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"

# `skills update` exits 0 no matter what happens and only prints "…up to date"
# on one of its several no-change paths. It stays silent about being current
# when a source is skipped, when there is nothing global to check, and, most
# often here, when the check itself fails ("Failed to check skills from …"),
# which is routine because the unauthenticated GitHub API allows just 60 calls
# an hour and the git-clone fallback is its own failure surface. Matching on the
# phrase therefore reports a phantom change whenever the quota runs dry, so
# checksum the installed skill around the call and let the files decide.
- name: Fingerprint the herdr skill before updating
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"
    recurse: true
    file_type: file
    get_checksum: true
  register: herdr_skill_before

- name: Keep the herdr skill up to date from upstream
  ansible.builtin.command:
    cmd: npx skills update herdr -g -y
  register: herdr_skill_update
  changed_when: false

# `skills add` records the skill's upstream path in ~/.agents/.skill-lock.json at
# install time and never revisits it. When upstream moves the file (herdr went
# from a root SKILL.md to skills/herdr/SKILL.md) the lock keeps pointing at the
# old path, so `skills update` finds nothing there, calls the skill "deleted
# upstream", declines to act on it in non-interactive mode, and the skill
# silently freezes at its last-good version. This one sat unchanged from
# 2026-07-02 to 2026-08-20 that way. Re-running `add` is what rewrites the path,
# and the `creates:` guard above will never do it, so trigger it from the
# warning. Matching a phrase is defensible here in a way it was not for
# `changed_when`: this is a positive sentinel on exactly one branch, and a missed
# match leaves a stale skill rather than inventing a change that never happened.
- name: Re-add the herdr skill when upstream has moved its path
  ansible.builtin.command:
    cmd: npx skills add herdrdev/herdr --skill herdr -g -y
  when: "'deleted upstream' in herdr_skill_update.stdout"
  # Reaching this task means the drift was detected, and running it rewrites the
  # lock entry, so the repair is a real change even when the skill's own files
  # come back byte-identical. The checksum task below reports content separately.
  changed_when: true

- name: Check whether the herdr skill was updated
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.agents/skills/herdr"
    recurse: true
    file_type: file
    get_checksum: true
  register: herdr_skill_after
  changed_when: >-
    (herdr_skill_after.files | map(attribute='checksum') | sort)
    != (herdr_skill_before.files | map(attribute='checksum') | sort)

- name: Symlink ~/.claude/skills/herdr to ~/.agents/skills/herdr
  ansible.builtin.file:
    # Relative, not absolute: this is agentstow's canonical link form, and it
    # owns the same path. An absolute target reads as "not in canonical form" in
    # `agentstow status`, so the two rewrite each other forever: one CHANGED
    # task per play, and a re-link on every `agentstow sync`.
    src: "../../.agents/skills/herdr"
    dest: "{{ lookup('env', 'HOME') }}/.claude/skills/herdr"
    state: link
    force: true

# The rename hook from soulmachine/skills' herdr-rename-hook skill (DECISIONS Q13): a Claude Code
# or Codex `/rename` is mirrored onto the calling Herdr pane's agent, pane and tab. The skills
# role adopts that skill into the store; its install.sh owns the wiring (the script in
# ~/.claude/hooks, merged entries in ~/.claude/settings.json and ~/.codex/hooks.json), and
# `install.sh --check` prints the state, which the tasks below diff.
- name: Check for the herdr rename hook skill
  ansible.builtin.stat:
    path: "{{ herdr_rename_installer }}"
  register: herdr_rename_skill

- name: Report that the herdr rename hook skill is missing
  ansible.builtin.debug:
    msg: >-
      {{ herdr_rename_installer }} is missing, so the /rename hook was not installed. The skills
      role adopts it from ~/github.com/soulmachine/skills; run that role, then this one.
  when: not herdr_rename_skill.stat.exists

- name: Install the herdr rename hook
  when: herdr_rename_skill.stat.exists
  block:
    - name: Check the herdr rename hook
      ansible.builtin.command: sh {{ herdr_rename_installer }} --check
      register: herdr_rename_before
      changed_when: false
      failed_when: false
      check_mode: false

    # The installer's self-check runs only inside a Herdr pane, and a play started from an
    # agent's pane inherits HERDR_ENV; clearing it keeps a play's result the same everywhere.
    - name: Run the herdr rename hook installer
      ansible.builtin.command: sh {{ herdr_rename_installer }}
      environment:
        HERDR_ENV: ""
      when: herdr_rename_before.rc != 0
      changed_when: false

    - name: Check whether the herdr rename hook changed
      ansible.builtin.command: sh {{ herdr_rename_installer }} --check
      register: herdr_rename_after
      changed_when: herdr_rename_after.stdout != herdr_rename_before.stdout
      failed_when: false
      check_mode: false
      when: herdr_rename_before.rc != 0

    # The installer never edits ~/.codex/config.toml, so a Codex with `[features] hooks` off
    # stays "not installed" here on every play until someone turns it on.
    - name: Report a herdr rename hook that is still incomplete
      ansible.builtin.debug:
        msg: "{{ herdr_rename_after.stdout_lines }}"
      when:
        - herdr_rename_before.rc != 0
        - herdr_rename_after.rc | default(0) != 0
