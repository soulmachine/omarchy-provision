---
# Orca (https://onorca.dev): the AUR package for its CLI, and the server, because every Omarchy
# host is always-on (DECISIONS Q26, macbook-provision Q243). Orca has no separate server package:
# the CLI and `orca serve` ship inside the app.
#
# `stably-orca-bin` is the first AUR package since Q10, by Frank's request. It extracts
# upstream's AppImage to /opt/stably-orca. `omarchy-update -y` in the pacman role upgrades it,
# so this role adds it when missing and nothing else. No `become`: yay calls sudo itself, and
# the pacman module's yay mode cannot see AUR packages (Q3).
- name: Check whether Orca is installed
  ansible.builtin.command: pacman -Q stably-orca-bin
  register: orca_pkg
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Orca from the AUR
  ansible.builtin.command: yay -S --needed --noconfirm stably-orca-bin
  when: orca_pkg.rc != 0
  changed_when: true

# The package adds only a GUI wrapper, /usr/bin/stably-orca, and no `orca-ide` on PATH. The
# CLI sits in the app tree, at a path no upgrade changes, so the service unit can pin it.
- name: Set the Orca CLI path
  ansible.builtin.set_fact:
    orca_cli: /opt/stably-orca/resources/bin/orca-ide

# Settings → General → Orca CLI counts the CLI as registered when ~/.local/bin/orca-ide links
# to the app's launcher, which is orca_cli. It also puts `orca-ide` on PATH. No `force`: like
# the app, refuse to replace a file there that is not ours.
- name: Register the Orca CLI
  ansible.builtin.file:
    src: "{{ orca_cli }}"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/orca-ide"
    state: link

# The app and the service cannot share ~/.config/orca: the service's server holds it, and the
# app refuses to start (Q42). Frank chose the server alone, so a user entry hides the package's
# launcher. The package stays, because the CLI and `orca serve` run its Electron binary.
- name: Hide the Orca desktop launcher
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.local/share/applications/stably-orca.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Orca
      Hidden=true
      NoDisplay=true
    mode: "0644"

# Orca's skill for driving its CLI, the copy this Orca build ships. `skills install` writes it to
# ~/.agents/skills/orca-cli and links it into each agent it detects, and later replaces a copy
# Orca wrote with a newer build's. It is an updater, so `changed` comes from the files before and
# after, not from its output. Only the files: agent-sync adds its own links to the same skill.
# A login shell, so it detects the agent CLIs on mise's shims.
- name: Read the orca-cli skill before installing
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; find "$HOME/.agents/skills/orca-cli" -type f -exec cksum {} + 2>/dev/null
      | sort | cksum
    executable: /bin/bash
  register: orca_skill_before
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the orca-cli skill
  ansible.builtin.command: bash -lc '{{ orca_cli }} skills install --skill orca-cli'
  changed_when: false

- name: Read the orca-cli skill after installing
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail; find "$HOME/.agents/skills/orca-cli" -type f -exec cksum {} + 2>/dev/null
      | sort | cksum
    executable: /bin/bash
  register: orca_skill_after
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report the orca-cli skill
  ansible.builtin.debug:
    msg: "orca-cli skill {{ 'installed or updated' if orca_skill_changed else 'already current' }}"
  vars:
    orca_skill_changed: "{{ orca_skill_before.stdout | default('') != orca_skill_after.stdout | default('') }}"
  changed_when: orca_skill_changed

# Upstream's `orca serve service install` writes, enables and restarts the systemd user unit
# `orca-serve.service`, which runs `orca-ide serve --supervise --no-pairing`: it restarts the
# server with backoff and waits while an update replaces the app. It runs only when the service
# is not live, because a reinstall restarts the server and kills its sessions. Port 6768 is
# fixed so paired clients keep their address across restarts. A login shell, because the unit
# pins the PATH it is installed with, and the agent CLIs the server spawns live on mise's shims.
# Pairing stays manual (see README).
- name: Run the Orca server
  block:
    # `default('{}', true)`: under `--check` a skipped read leaves an empty stdout.
    - name: Read the Orca server service
      ansible.builtin.command: bash -lc '{{ orca_cli }} serve service status --json'
      register: orca_service
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Parse the Orca server service status
      ansible.builtin.set_fact:
        orca_status: "{{ orca_service.stdout | default('{}', true) | from_json }}"

    # A host can hand serving to the desktop app, as mac-mini-m6 did (coding-agent Q638). Install
    # re-enables a disabled unit, so the way to keep it off is `systemctl --user mask orca-serve`.
    - name: Read whether the Orca server unit is masked
      ansible.builtin.systemd_service:
        name: orca-serve.service
        scope: user
      register: orca_enabled
      failed_when: false
      check_mode: false

    - name: Report that the Orca server is masked on this host
      ansible.builtin.debug:
        msg: >-
          Skipping the Orca server: orca-serve.service is masked, so the desktop app serves
          instead. `systemctl --user unmask orca-serve.service` undoes it.
      when: orca_enabled.status.UnitFileState | default('') == 'masked'

    # Orca 1.4.224 (2026-10-10) predates `serve service` (macbook-provision Q243): it answers
    # `invalid_argument`. Skip until `omarchy-update` brings a release that ships it.
    - name: Report that this Orca cannot install its server yet
      ansible.builtin.debug:
        msg: >-
          Skipping the Orca server: this Orca has no `orca-ide serve service` command yet
          ({{ orca_status.error.message | default('') }}). A later play installs it once
          `omarchy-update` brings a release that ships it.
      when: orca_status.error.code | default('') == 'invalid_argument'

    - name: Install and check the Orca server service
      when:
        - orca_status.error.code | default('') != 'invalid_argument'
        - not (orca_enabled.status.UnitFileState | default('') == 'masked')
      block:
        # The address that pairing offers advertise to clients. An IP, not a MagicDNS name,
        # because one fleet host answers *.ts.net from a fake-IP resolver. No Tailscale, no flag.
        # 2>/dev/null hides tailscale's client/server version-mismatch warning.
        - name: Read this host's Tailscale address
          ansible.builtin.command: bash -lc 'tailscale ip -4 2>/dev/null | head -1'
          register: orca_tailscale
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Install the Orca server service
          ansible.builtin.command: >-
            bash -lc '{{ orca_cli }} serve service install --port 6768 --command {{ orca_cli }}
            {%- if orca_tailscale.stdout | default('') is match('^100\.\d+\.\d+\.\d+$') %}
            --pairing-address {{ orca_tailscale.stdout }}{% endif %} --json'
          changed_when: true
          when: orca_status.result.verdict | default('') != 'live'

        # An active unit is not a live server, as roles/paseo explains. Allow 60s for the
        # install above to come up. `failed_when: false` holds when the retries run out, so a
        # down server is recorded, and main.yml's post_tasks fail the play on it after the
        # other roles have run.
        - name: Read whether the Orca server is live
          ansible.builtin.command: bash -lc '{{ orca_cli }} serve service status --json'
          register: orca_service_after
          changed_when: false
          failed_when: false
          check_mode: false
          retries: 12
          delay: 5
          until: (orca_service_after.stdout | default('{}', true) | from_json).result.verdict | default('') == 'live'

        # A host fact, not a role var, so main.yml's post_tasks can read it.
        - name: Record an Orca server that is not live
          ansible.builtin.set_fact:
            orca_serve_down: >-
              The Orca server is not live after 60s of waiting
              ({{ (orca_service_after.stdout | default('{}', true) | from_json).result | default('no status') }}).
              `{{ orca_cli }} serve service status` says why, and `journalctl --user -u
              orca-serve` holds its log. `{{ orca_cli }} serve service install --port 6768
              --command {{ orca_cli }} --pairing-address <tailscale-ip>` clears a supervisor
              that gave up.
          when: (orca_service_after.stdout | default('{}', true) | from_json).result.verdict | default('') != 'live'

        # post_tasks only run in a full play; a single-role run reports it here.
        - name: Report an Orca server that is not live
          ansible.builtin.debug:
            msg: "{{ orca_serve_down }}"
          when: orca_serve_down is defined
