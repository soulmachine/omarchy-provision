---
# Codex is Omarchy's mise tool with its ~/.local/bin/codex stub; the mise role's `mise up`
# keeps it current. No ChatGPT.app on Linux, so the Mac role's cask-and-symlink half is gone.
- name: Ensure Codex is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: codex
    mise_cmd: codex

# --- open-pstack (retired) ---------------------------------------------------
# Removed fleet-wide in Q29. The `[marketplaces.*]` / `[plugins."*"]` sections in
# config.toml are the markers. Delete this block once every host is clean.
#
# no_log on both: config.toml carries API keys in `[mcp_servers.*.env]`, and an ad-hoc
# `include_role` run prints every result in full, base64 being no protection.
- name: Read the Codex config
  ansible.builtin.slurp:
    src: "{{ codex_home }}/config.toml"
  register: codex_config_raw
  failed_when: false
  no_log: true

- name: Decode the Codex config
  ansible.builtin.set_fact:
    codex_config: "{{ codex_config_raw.content | default('') | b64decode }}"
  no_log: true

- name: Remove the retired pstack Codex plugin
  ansible.builtin.command: codex plugin remove pstack@open-pstack
  when: "'[plugins.\"pstack@open-pstack\"]' in codex_config"
  changed_when: true

- name: Remove the retired open-pstack Codex marketplace
  ansible.builtin.command: codex plugin marketplace remove open-pstack
  when: "'[marketplaces.open-pstack]' in codex_config"
  changed_when: true

# `codex plugin remove` leaves the plugin's hook-trust entry behind.
- name: Remove the retired pstack hook-trust entry
  ansible.builtin.replace:
    path: "{{ codex_home }}/config.toml"
    regexp: '^\[hooks\.state\."pstack@open-pstack:[^\n]*\n(?:[^\[\n][^\n]*\n)*\n?'
    replace: ""
  when: "'[hooks.state.\"pstack@open-pstack:' in codex_config"
  no_log: true

- name: Add codex-yolo alias to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'alias codex-yolo="codex --yolo -c model_reasoning_effort=high"'
    regexp: '^alias codex-yolo='
    state: present
