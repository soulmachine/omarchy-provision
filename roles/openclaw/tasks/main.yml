---
# OpenClaw in the form Omarchy installs it: the `openclaw` pacman package, the one OpenClaw
# install on the machine, which `omarchy-update` keeps current. `--check` is a `pacman -Q`
# probe; `--now` installs the package and calls sudo itself.
- name: Check whether OpenClaw is installed
  ansible.builtin.command: omarchy-install-openclaw-cli --check
  register: openclaw_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install OpenClaw with Omarchy's installer
  ansible.builtin.command: omarchy-install-openclaw-cli --now
  when: openclaw_check.rc != 0
  changed_when: true

# Onboarding is `cliproxy-tier <host>`'s job on mac-mini-m2 (DECISIONS Q15, superseding Q11's
# manual step): it writes the gateway provider, the key in ~/.openclaw/.env and the always-on
# daemon. So the play only says when it has not run yet.
- name: Check whether OpenClaw is onboarded
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.openclaw/openclaw.json"
  register: openclaw_config

- name: Report that OpenClaw is not onboarded
  ansible.builtin.debug:
    msg: >-
      OpenClaw is installed but not onboarded, so it has no model. Run `cliproxy-tier <host>` on
      mac-mini-m2, which onboards it through the gateway.
  when: not openclaw_config.stat.exists

# The daemon's service file names an absolute Node and OpenClaw entrypoint, so after the nodejs
# role moves Node or OpenClaw itself is upgraded, it keeps running the old pair, and it breaks once
# mise prunes that Node. `gateway install --force` rewrites the service for the current pair and
# restarts it. OpenClaw prefers a system Node where one exists (Omarchy's /usr/bin/node), so only a
# service on a mise Node is compared with the current Node; any service is compared by version.
- name: Read the OpenClaw daemon's state
  ansible.builtin.command: openclaw gateway status --json
  register: openclaw_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the current Node
  ansible.builtin.command: node -p process.execPath
  register: openclaw_node
  changed_when: false
  failed_when: false
  check_mode: false

# The service's Node is not always its first argument: on macOS the daemon can start
# `/bin/sh <env wrapper> <env file> <node> ...` (macbook-provision, 2026-10-25).
- name: Find the OpenClaw daemon's Node
  ansible.builtin.set_fact:
    openclaw_svc_args: "{{ openclaw_svc.command.programArguments | default([]) }}"
    openclaw_svc_node: >-
      {{ (openclaw_svc.command.programArguments | default([]) | select('match', '.*/node$') | list
          + openclaw_svc.command.programArguments | default([]) + [''])[0] }}
    openclaw_svc_version: "{{ openclaw_svc.layout.packageVersion | default('') }}"
    openclaw_cli_version: "{{ openclaw_state.cli.version | default('') }}"
  vars:
    openclaw_state: >-
      {{ openclaw_status.stdout | from_json
         if openclaw_status.rc == 0 and (openclaw_status.stdout | trim)[:1] == '{' else {} }}
    openclaw_svc: "{{ openclaw_state.service | default({}) }}"

# A Node that is gone is stale wherever it lived, such as one mise has pruned.
- name: Check that the OpenClaw daemon's Node exists
  ansible.builtin.stat:
    path: "{{ openclaw_svc_node }}"
  register: openclaw_svc_node_stat
  when: openclaw_svc_node | length > 0

- name: Decide whether the OpenClaw daemon runs an old Node or OpenClaw
  ansible.builtin.set_fact:
    openclaw_daemon_stale: >-
      {{ openclaw_svc_args | length > 0
         and (('/mise/installs/' in openclaw_svc_node and openclaw_svc_node != openclaw_node.stdout | trim)
              or not (openclaw_svc_node_stat.stat.exists | default(false))
              or openclaw_svc_version != openclaw_cli_version) }}

- name: Rewrite the OpenClaw daemon for the current Node and OpenClaw
  ansible.builtin.command: openclaw gateway install --force
  when: openclaw_daemon_stale | bool
  changed_when: true
