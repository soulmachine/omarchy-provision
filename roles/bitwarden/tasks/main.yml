---
# Bitwarden clients for Frank's Vaultwarden (~/coding-agent/docs/vaultwarden.md): `rbw` and the
# official Electron desktop app from Arch's `extra`, the desktop app skipped on a headless host,
# and the official `bw` CLI through mise. `omarchy-update` upgrades them (Q2). Install only: the
# server URL, email and login are set by hand (upstream Q242).
- name: Install rbw
  become: true
  community.general.pacman:
    name: rbw
    state: present

# Not pacman `bitwarden-cli`: it depends on `nodejs-lts-jod`, which conflicts with the
# `nodejs` Omarchy installs (DECISIONS Q23).
- name: Ensure the Bitwarden CLI is installed through mise
  ansible.builtin.include_role:
    name: mise
    tasks_from: tool
  vars:
    mise_tool: "npm:@bitwarden/cli"
    mise_cmd: bw

# Headless means no X11 or Wayland session file (DECISIONS Q22). Omarchy's Hyprland ships one.
- name: Look for a desktop session
  ansible.builtin.find:
    paths:
      - /usr/share/xsessions
      - /usr/share/wayland-sessions
    patterns: "*.desktop"
  register: bitwarden_sessions

- name: Install the Bitwarden desktop app
  become: true
  community.general.pacman:
    name: bitwarden
    state: present
  when: bitwarden_sessions.matched > 0

- name: Report that the Bitwarden desktop app was skipped
  ansible.builtin.debug:
    msg: Skipping the Bitwarden desktop app, because this host has no X11 or Wayland session.
  when: bitwarden_sessions.matched == 0
