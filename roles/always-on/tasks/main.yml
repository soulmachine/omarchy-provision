---
# Every Omarchy host is an always-on server (grilling Q2). This role owns the state that
# makes it one, each item as it was first applied by hand on mac-mini-2018-omarchy and
# recorded in coding-agent's DECISIONS.md (Q362 to Q364, Q367) and fleet-ssh.md.

# A mask blocks every path to sleep at once: the menu, a keyboard's sleep key and any
# `systemctl suspend` (coding-agent Q362).
- name: Mask the systemd sleep targets
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target
    - suspend-then-hibernate.target

# What `omarchy-toggle suspend-off` creates: an empty file that hides Suspend from the
# Omarchy menu (coding-agent Q362). Times preserved, so it changes only when created.
- name: Hide Suspend from the Omarchy menu
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/state/omarchy/toggles/suspend-off"
    state: touch
    mode: "0644"
    access_time: preserve
    modification_time: preserve

# `zz-` names, so Omarchy's own `99-` drop-ins cannot override them (coding-agent Q364).
- name: Log straight back in if the session ends
  become: true
  ansible.builtin.copy:
    dest: /etc/sddm.conf.d/zz-relogin.conf
    content: |
      # Always-on server: log straight back in if the session ends (coding-agent Q364)
      [Autologin]
      Relogin=true
    mode: "0644"

- name: Reboot after a kernel panic instead of hanging
  become: true
  ansible.builtin.copy:
    dest: /etc/sysctl.d/zz-always-on.conf
    content: |
      # Always-on server: reboot 10 s after a panic, and panic on an oops or a hard lockup (coding-agent Q364)
      kernel.panic = 10
      kernel.panic_on_oops = 1
      kernel.hardlockup_panic = 1
    mode: "0644"
  notify: Apply the sysctls

# The pacman role reboots when one is due (DECISIONS Q14), so the Sunday reboot check that
# coding-agent Q364 added is retired. These two remove it from a host that still has it.
- name: Remove the weekly reboot check from cron
  ansible.builtin.cron:
    name: omarchy-weekly-update
    state: absent

- name: Remove the weekly reboot check script
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/omarchy-weekly-update"
    state: absent

# The screensaver cannot be switched off in shell.json, so it is set one day out, past the
# 300 s lock, and Omarchy skips it on a locked screen (coding-agent Q363). Merged into the
# existing file, so `idle.lock` and every other key stay as they are. Gated on the merge
# changing something, as the claude-code role does for settings.json, because
# `to_nice_json` and Omarchy format the file differently.
- name: Read the Omarchy shell settings
  ansible.builtin.slurp:
    src: "{{ lookup('env', 'HOME') }}/.config/omarchy/shell.json"
  register: always_on_shell_raw

- name: Merge the screensaver delay into the Omarchy shell settings
  ansible.builtin.set_fact:
    always_on_shell: "{{ always_on_shell_raw.content | b64decode | from_json }}"
    always_on_shell_merged: >-
      {{ always_on_shell_raw.content | b64decode | from_json
         | combine({'idle': {'screensaver': 86400}}, recursive=true) }}

- name: Push the screensaver past the lock
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/omarchy/shell.json"
    content: "{{ always_on_shell_merged | to_nice_json }}\n"
    mode: "0644"
  when: always_on_shell_merged != always_on_shell

# `omarchy-update` runs `sudo -v` under a pseudo-terminal, and sudo's default `verifypw=all`
# asks for a password unless every rule for the user is NOPASSWD, which Omarchy's asdcontrol
# rule is not (coding-agent Q367). bootstrap.sh writes the line on a new host; this converges
# a host bootstrapped before it existed. The file name is bootstrap.sh's.
- name: Let sudo -v pass without a password
  become: true
  ansible.builtin.lineinfile:
    path: "/etc/sudoers.d/zz-{{ lookup('env', 'USER') }}-nopasswd"
    regexp: "^Defaults:{{ lookup('env', 'USER') }} verifypw="
    line: "Defaults:{{ lookup('env', 'USER') }} verifypw=any"
    validate: visudo -cf %s
