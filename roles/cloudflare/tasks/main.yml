---
# cf — Cloudflare's CLI. https://blog.cloudflare.com/cf-cli-local-explorer/
# An npm global like the Macs and Ubuntu, not a mise tool: mise's "latest" skips prereleases and
# pins npm:cf to 0.15.0, the package's pre-Cloudflare owner, while every Cloudflare release is a
# 1.0.0 beta (DECISIONS.md Q51). become, because pacman's node has its global prefix in /usr.
- name: Install cf CLI
  community.general.npm:
    name: cf
    global: true
    state: latest
  become: true

# Retire the old mise copy: its config entry, its installs, and the ~/.local/bin stub, which comes
# before /usr/bin on PATH and would keep running 0.15.0.
- name: Read the mise tools
  ansible.builtin.command: mise ls --json
  register: cloudflare_mise_ls
  changed_when: false
  check_mode: false

- name: Remove the mise tool npm:cf
  # unuse drops the config entry but keeps the installs, and `mise ls` lists any installed tool.
  ansible.builtin.shell: mise unuse -g --quiet npm:cf && mise uninstall --all --quiet npm:cf
  when: "'npm:cf' in (cloudflare_mise_ls.stdout | from_json)"
  changed_when: true

- name: Remove the mise stub for cf
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin/cf"
    state: absent

# The Cloudflare skills are installed by the `skills` role, which lists
# cloudflare/skills in skills_sources and re-fetches it every play. They lived here
# behind a `creates:` sentinel, which froze all 8 at 2026-07-02.

# cloudflared: the client end of the public Gitea ssh tunnel (coding-agent Q997).
- name: Install cloudflared
  become: true
  community.general.pacman:
    name: cloudflared
    state: present

# Gitea's ssh is public through the Cloudflare tunnel `gitea` (coding-agent Q997): the client wraps
# it in a WebSocket with cloudflared. Absolute path: LaunchAgents and cron have no Homebrew PATH.
- name: Route git-ssh.soulmachine.io through cloudflared in ~/.ssh/config
  ansible.builtin.blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.ssh/config"
    create: true
    mode: "0600"
    marker: "# {mark} Gitea over the Cloudflare tunnel (cloudflare role)"
    block: |
      Host git-ssh.soulmachine.io
          User git
          ProxyCommand /usr/bin/cloudflared access ssh --hostname %h
